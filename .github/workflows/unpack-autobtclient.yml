name: Unpack BluetoothService and MtkSystemUI

on:
  push:
    paths:
      - ".github/workflows/unpack-autobtclient.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract archives into their own folders
        run: |
          set -e
          for folder in artifacts/BluetoothService artifacts/MtkSystemUI; do
            archive="$(basename "$folder").zip"
            if [ -f "$folder/$archive" ]; then
              echo "Extracting $folder/$archive into $folder"
              (cd "$folder" && 7z x "$archive" -o. -y)
              test "$(find "$folder" -type f ! -name '*.zip' ! -name '*.z[0-9]*' | wc -l)" -gt 0
            else
              echo "Archive not found: $folder/$archive"
            fi
          done

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A artifacts/BluetoothService artifacts/MtkSystemUI
          if ! git diff --cached --quiet; then
            git commit -m "Extract BluetoothService and MtkSystemUI archives in place"
            git push
          else
            echo "No extracted file changes."
          fi
