name: Unpack BluetoothService

on:
  push:
    paths:
      - ".github/workflows/unpack-autobtclient.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract split archive into BluetoothService
        run: |
          cd artifacts/BluetoothService
          7z x BluetoothService.zip -o. -y
          test "$(find . -type f ! -name 'BluetoothService.zip' ! -name 'BluetoothService.z[0-9]*' | wc -l)" -gt 0

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A artifacts/BluetoothService
          if ! git diff --cached --quiet; then
            git commit -m "Extract BluetoothService files into archive directory"
            git push
          else
            echo "No extracted file changes."
          fi
