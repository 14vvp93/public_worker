name: Unpack framework archive

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/unpack-framework.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 7-Zip
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          command -v 7z

      - name: Validate and extract split ZIP
        shell: bash
        run: |
          set -euo pipefail
          target="rom/system/framework"
          archive="$target/framework.zip"
          test -s "$archive"
          test -s "$target/framework.z01"
          test -s "$target/framework.z02"
          7z t "$archive"

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          7z x "$archive" "-o$temp_dir" -y

          file_count="$(find "$temp_dir" -type f | wc -l)"
          test "$file_count" -gt 0
          cp -a "$temp_dir/." "$target/"

          rm "$target/framework.zip" "$target/framework.z01" "$target/framework.z02"

          printf 'Extracted files: %s\n' "$file_count"
          du -sh "$target"

      - name: Commit extracted files and remove archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- rom/system/framework
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "Extract system framework archive"
          git push
