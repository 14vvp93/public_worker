name: Unpack framework archive

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/unpack-framework.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 7-Zip
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          command -v 7z

      - name: Extract or flatten framework contents
        shell: bash
        run: |
          set -euo pipefail
          target="rom/system/framework"
          archive="$target/framework.zip"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          if [[ -s "$archive" && -s "$target/framework.z01" && -s "$target/framework.z02" ]]; then
            7z t "$archive"
            7z x "$archive" "-o$temp_dir" -y

            source_dir="$temp_dir"
            if [[ -d "$temp_dir/framework" ]] && [[ "$(find "$temp_dir" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]]; then
              source_dir="$temp_dir/framework"
            fi

            file_count="$(find "$source_dir" -type f | wc -l)"
            test "$file_count" -gt 0
            cp -a "$source_dir/." "$target/"
            rm "$target/framework.zip" "$target/framework.z01" "$target/framework.z02"
          elif [[ -d "$target/framework" ]]; then
            shopt -s dotglob nullglob
            entries=("$target/framework"/*)
            test "${#entries[@]}" -gt 0
            mv "$target/framework"/* "$target/"
            rmdir "$target/framework"
            file_count="${#entries[@]}"
          else
            echo "Neither split archive nor nested extracted directory exists." >&2
            exit 1
          fi

          printf 'Framework entries processed: %s\n' "$file_count"
          du -sh "$target"

      - name: Commit framework files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- rom/system/framework
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "Place extracted framework files in system framework directory"
          git push
