name: Analyze MT8163 framework MCU services

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/analyze-framework-mcu.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install analysis dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev git

      - name: Build VDEX extractor
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/anestisb/vdexExtractor.git /tmp/vdexExtractor
          cd /tmp/vdexExtractor
          sed -i 's/-Werror/-Wno-error/' src/Makefile
          ./make.sh gcc
          test -x bin/vdexExtractor
          echo "/tmp/vdexExtractor/bin" >> "$GITHUB_PATH"

      - name: Install JADX
        shell: bash
        run: |
          set -euo pipefail
          release="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest)"
          asset_url="$(printf '%s' "$release" | jq -r '.assets[] | select(.name | test("jadx-[0-9.]+\\.zip$")) | .browser_download_url' | head -n1)"
          test -n "$asset_url"
          curl -fsSL "$asset_url" -o /tmp/jadx.zip
          mkdir -p /opt/jadx
          unzip -q /tmp/jadx.zip -d /opt/jadx
          chmod +x /opt/jadx/bin/jadx
          echo "/opt/jadx/bin" >> "$GITHUB_PATH"

      - name: Extract and analyze every framework VDEX
        shell: bash
        run: |
          set -euo pipefail
          target="rom/system/framework"
          mkdir -p analysis/vdex analysis/decompiled
          : > analysis/vdex-extraction.log
          : > analysis/raw-strings.txt
          : > analysis/vdex-dependencies.txt

          mapfile -d '' vdex_files < <(find "$target" -type f -name '*.vdex' -print0 | sort -z)
          test "${#vdex_files[@]}" -gt 0

          for file in "${vdex_files[@]}"; do
            relative="${file#"$target"/}"
            safe_name="${relative//\//_}"
            out="analysis/vdex/${safe_name%.vdex}"
            mkdir -p "$out"

            echo "===== $relative =====" | tee -a analysis/vdex-extraction.log
            vdexExtractor -i "$file" -o "$out" -f --ignore-crc-error 2>&1 | tee -a analysis/vdex-extraction.log || true
            vdexExtractor -i "$file" -o "$out" -f --deps 2>&1 >> analysis/vdex-dependencies.txt || true
            case "$relative" in
              boot-framework.vdex|boot-carservices.vdex|oat/arm/services.vdex|oat/arm/mediatek-services.vdex|boot-mediatek-framework.vdex)
                vdexExtractor -i "$file" -o "$out" -f --ignore-crc-error --dis -l "analysis/${safe_name%.vdex}-disassembly.txt" >/dev/null 2>&1 || true
                ;;
            esac

            while IFS= read -r -d '' dex; do
              echo "===== $relative :: $(basename "$dex") =====" >> analysis/raw-strings.txt
              strings -a "$dex" >> analysis/raw-strings.txt
              dex_name="$(basename "$dex" .dex)"
              jadx --no-res --show-bad-code -d "analysis/decompiled/${safe_name%.vdex}_${dex_name}" "$dex" >"analysis/${safe_name%.vdex}-jadx.log" 2>&1 || true
            done < <(find "$out" -type f \( -name '*.dex' -o -name '*.cdex' \) -print0)
          done

          {
            echo "# MT8163 framework MCU analysis"
            echo
            echo "## VDEX files processed"
            find "$target" -type f -name '*.vdex' -printf '%P (%s bytes)\n' | sort
            echo
            echo "## Extractor summary"
            grep -E 'Processing|processed|extracted|Extracted Dex|ERROR|FATAL|WARNING' analysis/vdex-extraction.log | tail -n 500 || true
            echo
            echo "## MCU and accessory strings"
            grep -Ein -C 4 'McuService|headset state|accessory|accessory.?manager|mcu|MCU|uart|serial|com\\.mediatek' analysis/raw-strings.txt | head -n 3000 || true
            echo
            echo
            echo "## Android task lifecycle source matches (services.vdex)"
            grep -RInE -C 8 'class (RecentTasks|TaskRecord|TaskPersister|ActivityStackSupervisor)|mPersistedTaskIds|removedFromRecents|autoRemoveRecents|addLocked|trim' analysis/decompiled/oat_arm_services_* --include='*.java' | head -n 30000 || true
            echo "## Decompiled source matches"
            grep -RInE -C 5 'McuService|headset state|accessory|accessory.?manager|mcu|MCU|uart|serial' analysis/decompiled --include='*.java' | head -n 5000 || true
            echo
            echo "## Candidate classes"
            find analysis/decompiled -type f -name '*.java' | grep -Ei 'mcu|accessory|headset|mediatek|serial|uart' | head -n 1000 || true
            echo
            echo "## McuService disassembly"
            grep -n -E -C 12 'McuService|android/carsource|IMcuManager|IMcuListener|MCUD_MESSAGE|SOCKET_NAME_MCU' analysis/*-disassembly.txt | head -n 5000 || true
            echo
            echo "## SourceService disassembly"
            grep -n -E -C 60 'Landroid/sourceservice/SourceService;|SourceService|muxMediaPlayer|onActivityStatus|BT_UI|A2DP' analysis/*-disassembly.txt | head -n 16000 || true
            echo
            echo "## SourceInfo API"
            grep -RInE -C 12 'SourceInfo|getSourcePackage|onRequestPlayAudio|sourceservice' analysis/decompiled --include='*.java' | head -n 12000 || true
            echo
            echo "## SourceInfo disassembly"
            grep -n -E -C 80 'Landroid/sourceservice/SourceInfo;|getSourcePackage|onRequestPlayAudio|sourceservice' analysis/*-disassembly.txt | head -n 20000 || true
            echo
            echo "## VDEX dependency matches"
            grep -Ein -C 2 'McuService|headset|accessory|mcu|mediatek|serial|uart' analysis/vdex-dependencies.txt | head -n 2000 || true
          } > analysis/MCU-REPORT.md

          cat analysis/MCU-REPORT.md

      - name: Publish analysis into artifacts/framework
        shell: bash
        run: |
          set -euo pipefail
          target="artifacts/framework"
          mkdir -p "$target"
          cp analysis/MCU-REPORT.md "$target/"
          for dump in analysis/*-disassembly.txt; do
            if [[ -f "$dump" ]]; then
              gzip -9 -c "$dump" > "$target/$(basename "$dump").gz"
            fi
          done
          cp analysis/vdex-extraction.log analysis/vdex-dependencies.txt analysis/raw-strings.txt "$target/"
          mkdir -p "$target/sourceinfo"
          while IFS= read -r -d '' source; do
            relative="${source#analysis/decompiled/}"
            mkdir -p "$target/sourceinfo/$(dirname "$relative")"
            cp "$source" "$target/sourceinfo/$relative"
          done < <(find analysis/decompiled -type f -name '*.java' -print0 | xargs -0 -r grep -lE 'SourceInfo|getSourcePackage|onRequestPlayAudio|package android\.sourceservice' | tr '\\n' '\\0')

          mkdir -p "$target/services"
          : > "$target/services/FILE_INDEX.txt"
          for root in analysis/decompiled/oat_arm_services_*; do
            [[ -d "$root" ]] || continue
            while IFS= read -r -d '' source; do
              if grep -Eq 'class (RecentTasks|TaskRecord|TaskPersister|ActivityStackSupervisor)' "$source"; then
                relative="${source#"$root"/}"
                mkdir -p "$target/services/$(dirname "$relative")"
                cp "$source" "$target/services/$relative"
                printf '%s\\n' "$relative" >> "$target/services/FILE_INDEX.txt"
              fi
            done < <(find "$root" -type f -name '*.java' -print0)
          done

          for log in analysis/*-jadx.log; do
            if [[ -f "$log" ]]; then cp "$log" "$target/"; fi
          done
          printf '%s\\n' "# Framework MCU analysis" "" "Generated by GitHub Actions run: $GITHUB_RUN_ID" "Source: rom/system/framework" "" > "$target/README.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m "Store framework MCU analysis artifacts"
            git push
          fi

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: mt8163-framework-mcu-analysis
          path: analysis/
          if-no-files-found: error
          retention-days: 14
