name: Decompile CarServices VDEX

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/decompile-carservices.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decompile-carservices
  cancel-in-progress: false

jobs:
  inspect-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect CarServices inputs
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/input-inspection
          report="artifacts/input-inspection/REPORT.txt"
          {
            echo "=== carservices.jar ==="
            ls -l rom/system/framework/carservices.jar
            file rom/system/framework/carservices.jar
            sha256sum rom/system/framework/carservices.jar
            echo
            echo "--- ZIP integrity ---"
            unzip -t rom/system/framework/carservices.jar
            echo "unzip_exit_code=$?"
            echo
            echo "--- ZIP entries ---"
            unzip -l rom/system/framework/carservices.jar
            echo "unzip_list_exit_code=$?"
            echo
            echo "--- JAR entries ---"
            jar tf rom/system/framework/carservices.jar
            echo "jar_list_exit_code=$?"
            echo
            echo "--- Manifest ---"
            unzip -p rom/system/framework/carservices.jar META-INF/MANIFEST.MF
            echo
            echo "=== boot-carservices.vdex ==="
            ls -l rom/system/framework/boot-carservices.vdex
            file rom/system/framework/boot-carservices.vdex
            sha256sum rom/system/framework/boot-carservices.vdex
            echo
            echo "--- VDEX header ---"
            xxd -l 64 rom/system/framework/boot-carservices.vdex
          } > "$report" 2>&1
          cat "$report"

      - name: Upload input inspection
        uses: actions/upload-artifact@v4
        with:
          name: CarServices-input-inspection
          path: artifacts/input-inspection/REPORT.txt
          if-no-files-found: error
          retention-days: 30

  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev git unzip wget perl

      - name: Build vdexExtractor
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/anestisb/vdexExtractor.git /tmp/vdexExtractor
          cd /tmp/vdexExtractor
          sed -i 's/-Werror/-Wno-error/' src/Makefile
          ./make.sh gcc
          test -x bin/vdexExtractor
          echo "/tmp/vdexExtractor/bin" >> "$GITHUB_PATH"

      - name: Download static CompactDEX converter
        shell: bash
        run: |
          set -euo pipefail
          deps_dir="/tmp/compact-dex-converter"
          archive="$deps_dir/converter.zip"
          mkdir -p "$deps_dir"

          curl --fail --location --silent --show-error --retry 2 \
            "https://github.com/anestisb/vdexExtractor/files/2351606/compact_dex_converter_linux.zip" \
            --output "$archive"

          unzip -tq "$archive"
          unzip -q -o "$archive" -d "$deps_dir"
          converter_source="$(find "$deps_dir" -type f -name compact_dex_converter -print -quit)"
          test -n "$converter_source"

          converter="$deps_dir/compact_dex_converter"
          install -m 0755 "$converter_source" "$converter"
          file "$converter" | tee "$deps_dir/converter-file.txt"
          file "$converter" | grep -q 'ELF 64-bit LSB.*x86-64'
          echo "$deps_dir" >> "$GITHUB_PATH"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build JADX from source
        id: jadx
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/skylot/jadx.git /tmp/jadx
          cd /tmp/jadx
          ./gradlew dist --no-daemon
          test -x build/jadx/bin/jadx
          echo "/tmp/jadx/build/jadx/bin" >> "$GITHUB_PATH"
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Verify VDEX input
        shell: bash
        run: |
          set -euo pipefail
          input="rom/system/framework/boot-carservices.vdex"
          test -s "$input"
          file "$input"
          sha256sum "$input"

      - name: Extract CompactDEX from VDEX
        shell: bash
        run: |
          set -euo pipefail
          input="$GITHUB_WORKSPACE/rom/system/framework/boot-carservices.vdex"
          output="$GITHUB_WORKSPACE/artifacts/CarServises"
          extracted="$output/extracted"
          mkdir -p "$extracted"

          vdexExtractor -i "$input" -o "$extracted" --ignore-crc-error 2>&1 | tee "$output/vdex-extractor.log"

          mapfile -d '' cdex_files < <(find "$extracted" -type f -name '*.cdex' -print0 | sort -z)
          if (( ${#cdex_files[@]} == 0 )); then
            echo "vdexExtractor did not produce CompactDEX files." >&2
            find "$extracted" -type f -print >&2
            exit 1
          fi

          printf 'COMPACTDEX_COUNT=%s\\n' "${#cdex_files[@]}" > "$output/EXTRACTION_INFO.txt"
          file "${cdex_files[@]}" | tee "$output/compactdex-file-info.txt"

      - name: Convert CompactDEX to standard DEX
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/artifacts/CarServises"
          extracted="$output/extracted"
          converted="$output/converted"
          mkdir -p "$converted"

          mapfile -d '' cdex_files < <(find "$extracted" -type f -name '*.cdex' -print0 | sort -z)
          if (( ${#cdex_files[@]} == 0 )); then
            echo "No CompactDEX files found for conversion." >&2
            exit 1
          fi

          compact_dex_converter -w "$converted" "${cdex_files[@]}" 2>&1 | tee "$output/compact-dex-converter.log"

          while IFS= read -r -d '' converted_cdex; do
            dex_file="${converted_cdex%.cdex}.dex"
            mv "$converted_cdex" "$dex_file"
          done < <(find "$converted" -type f -name '*.cdex' -print0)

          mapfile -d '' dex_files < <(find "$converted" -type f -name '*.dex' -print0 | sort -z)
          if (( ${#dex_files[@]} == 0 )); then
            echo "CompactDEX converter did not produce standard DEX files." >&2
            find "$converted" -type f -print >&2
            exit 1
          fi

          for dex in "${dex_files[@]}"; do
            if ! head -c 8 "$dex" | grep -aq '^dex\\n'; then
              echo "Invalid standard DEX header: $dex" >&2
              exit 1
            fi
          done
          printf 'DEX_COUNT=%s\\n' "${#dex_files[@]}" > "$output/CONVERSION_INFO.txt"
          file "${dex_files[@]}" | tee "$output/dex-file-info.txt"

      - name: Decompile standard DEX with JADX
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/artifacts/CarServises"
          converted="$output/converted"
          jadx_output="$output/jadx"
          mkdir -p "$jadx_output"

          mapfile -d '' dex_files < <(find "$converted" -type f -name '*.dex' -print0 | sort -z)
          if (( ${#dex_files[@]} == 0 )); then
            echo "No standard DEX files found for JADX." >&2
            exit 1
          fi

          for dex in "${dex_files[@]}"; do
            name="$(basename "$dex" .dex)"
            target="$jadx_output/$name"
            mkdir -p "$target"
            set +e
            jadx --show-bad-code --threads-count 2 -d "$target" "$dex" 2>&1 | tee "$target/jadx.log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -ne 0 && "$status" -ne 3 ]]; then
              exit "$status"
            fi

            source_count="$(find "$target/sources" -type f -name '*.java' 2>/dev/null | wc -l)"
            if (( source_count == 0 )); then
              echo "JADX produced no Java source files for $dex." >&2
              exit 1
            fi
            printf 'JADX_EXIT_CODE=%s\\nJAVA_SOURCE_COUNT=%s\\n' "$status" "$source_count" > "$target/BUILD_INFO.txt"
          done

          input="rom/system/framework/boot-carservices.vdex"
          sha256sum "$GITHUB_WORKSPACE/$input" > "$output/input.sha256"
          {
            printf 'INPUT=%s\\n' "$input"
            printf 'JADX_VERSION=%s\\n' "${{ steps.jadx.outputs.version }}"
            printf 'DEX_COUNT=%s\\n' "${#dex_files[@]}"
            printf 'JAVA_SOURCE_COUNT=%s\\n' "$(find "$jadx_output" -type f -name '*.java' | wc -l)"
          } > "$output/BUILD_INFO.txt"
          find "$output" -type f | sort > "$output/FILE_INDEX.txt"

      - name: Commit decompilation results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/CarServises
          if git diff --cached --quiet; then
            echo "No decompilation output changes."
            exit 0
          fi
          git commit -m "Add CarServices VDEX decompilation"
          git push

      - name: Upload decompilation artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarServises-decompiled
          path: artifacts/CarServises/
          if-no-files-found: error
          retention-days: 30
