name: Decompile CarServices VDEX

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/decompile-carservices.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decompile-carservices
  cancel-in-progress: false

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev git unzip jq

      - name: Build vdexExtractor
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/anestisb/vdexExtractor.git /tmp/vdexExtractor
          cd /tmp/vdexExtractor
          sed -i 's/-Werror/-Wno-error/' src/Makefile
          ./make.sh gcc
          test -x bin/vdexExtractor
          echo "/tmp/vdexExtractor/bin" >> "$GITHUB_PATH"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build JADX from source
        id: jadx
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/skylot/jadx.git /tmp/jadx
          cd /tmp/jadx
          ./gradlew dist --no-daemon
          test -x build/jadx/bin/jadx
          echo "/tmp/jadx/build/jadx/bin" >> "$GITHUB_PATH"
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Verify VDEX input
        shell: bash
        run: |
          set -euo pipefail
          input="rom/system/framework/boot-carservices.vdex"
          test -s "$input"
          file "$input"
          sha256sum "$input"

      - name: Extract DEX and decompile
        shell: bash
        run: |
          set -euo pipefail
          input="rom/system/framework/boot-carservices.vdex"
          output="artifacts/CarServises"
          rm -rf "$output"
          mkdir -p "$output/dex" "$output/jadx"

          vdexExtractor -i "$input" -o "$output/dex" -f --ignore-crc-error 2>&1 | tee "$output/vdex-extractor.log"

          mapfile -d '' dex_files < <(find "$output/dex" -type f \( -name '*.dex' -o -name '*.cdex' \) -print0 | sort -z)
          if (( ${#dex_files[@]} == 0 )); then
            echo "No DEX or CompactDEX files were extracted from VDEX." >&2
            find "$output/dex" -maxdepth 3 -type f -print >&2
            exit 1
          fi

          for dex in "${dex_files[@]}"; do
            name="$(basename "$dex")"
            name="${name%.*}"
            target="$output/jadx/$name"
            mkdir -p "$target"
            set +e
            jadx --show-bad-code --threads-count 2 -d "$target" "$dex" 2>&1 | tee "$target/jadx.log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -ne 0 && "$status" -ne 3 ]]; then
              exit "$status"
            fi
            test -d "$target/sources"
            test -n "$(find "$target/sources" -type f -print -quit)"
            printf 'JADX_EXIT_CODE=%s\n' "$status" > "$target/BUILD_INFO.txt"
          done

          sha256sum "$input" > "$output/input.sha256"
          {
            printf 'INPUT=%s\n' "$input"
            printf 'JADX_VERSION=%s\n' "${{ steps.jadx.outputs.version }}"
            printf 'DEX_COUNT=%s\n' "${#dex_files[@]}"
          } > "$output/BUILD_INFO.txt"
          find "$output" -type f | sort > "$output/FILE_INDEX.txt"

      - name: Commit decompilation results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/CarServises
          if git diff --cached --quiet; then
            echo "No decompilation output changes."
            exit 0
          fi
          git commit -m "Add CarServices VDEX decompilation"
          git push

      - name: Upload decompilation artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarServises-decompiled
          path: artifacts/CarServises/
          if-no-files-found: error
          retention-days: 30
