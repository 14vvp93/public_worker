name: Decompile CarServices VDEX

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/decompile-carservices.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decompile-carservices
  cancel-in-progress: false

jobs:
  inspect-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect CarServices inputs
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/input-inspection
          report="artifacts/input-inspection/REPORT.txt"
          {
            echo "=== carservices.jar ==="
            ls -l rom/system/framework/carservices.jar
            file rom/system/framework/carservices.jar
            sha256sum rom/system/framework/carservices.jar
            echo
            echo "--- ZIP integrity ---"
            unzip -t rom/system/framework/carservices.jar
            echo "unzip_exit_code=$?"
            echo
            echo "--- ZIP entries ---"
            unzip -l rom/system/framework/carservices.jar
            echo "unzip_list_exit_code=$?"
            echo
            echo "--- JAR entries ---"
            jar tf rom/system/framework/carservices.jar
            echo "jar_list_exit_code=$?"
            echo
            echo "--- Manifest ---"
            unzip -p rom/system/framework/carservices.jar META-INF/MANIFEST.MF
            echo
            echo "=== boot-carservices.vdex ==="
            ls -l rom/system/framework/boot-carservices.vdex
            file rom/system/framework/boot-carservices.vdex
            sha256sum rom/system/framework/boot-carservices.vdex
            echo
            echo "--- VDEX header ---"
            xxd -l 64 rom/system/framework/boot-carservices.vdex
          } > "$report" 2>&1
          cat "$report"

      - name: Upload input inspection
        uses: actions/upload-artifact@v4
        with:
          name: CarServices-input-inspection
          path: artifacts/input-inspection/REPORT.txt
          if-no-files-found: error
          retention-days: 30

  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev git unzip wget perl

      - name: Build vdexExtractor
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/anestisb/vdexExtractor.git /tmp/vdexExtractor
          cd /tmp/vdexExtractor
          sed -i 's/-Werror/-Wno-error/' src/Makefile
          ./make.sh gcc
          test -x bin/vdexExtractor
          chmod +x tools/deodex/run.sh
          echo "/tmp/vdexExtractor/bin" >> "$GITHUB_PATH"

      - name: Download static CompactDEX converter
        shell: bash
        run: |
          set -euo pipefail
          deps_dir="/tmp/vdexExtractor/tools/deodex/hostTools/Linux/api-28"
          archive="$deps_dir/deps.zip"
          mkdir -p "$deps_dir"

          converter_url="https://github.com/anestisb/vdexExtractor/files/2351606/compact_dex_converter_linux.zip"
          curl --fail --location --silent --show-error --retry 2 \
            "$converter_url" --output "$archive"

          unzip -tq "$archive"
          archive_sha="$(sha256sum "$archive" | cut -d ' ' -f1)"
          echo "Static converter archive SHA-256: $archive_sha"

          unzip -q -o "$archive" -d "$deps_dir"
          converter_source="$(find "$deps_dir" -type f -name compact_dex_converter -print -quit)"
          test -n "$converter_source"
          converter="$deps_dir/bin/compact_dex_converter"
          mkdir -p "$(dirname "$converter")"
          if [[ "$converter_source" != "$converter" ]]; then
            install -m 0755 "$converter_source" "$converter"
          else
            chmod 0755 "$converter"
          fi
          test -x "$converter"
          file "$converter" | tee "$deps_dir/converter-file.txt"
          file "$converter" | grep -q 'ELF 64-bit LSB.*x86-64'

          ldd_output="$(ldd "$converter" 2>&1 || true)"
          if grep -qF 'not a dynamic executable' <<< "$ldd_output"; then
            echo "Static Linux x86-64 converter confirmed."
          else
            echo "Expected a statically linked converter, but dynamic dependencies were detected." >&2
            printf '%s\\n' "$ldd_output" >&2
            exit 1
          fi

          sed -i "s/^readonly L_DEPS_API_28_SIG=.*/readonly L_DEPS_API_28_SIG='$archive_sha'/" \
            /tmp/vdexExtractor/tools/deodex/constants.sh
          grep 'L_DEPS_API_28_SIG' /tmp/vdexExtractor/tools/deodex/constants.sh
          "$converter" 2>&1 | head -n 20 || test "${PIPESTATUS[0]}" -eq 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build JADX from source
        id: jadx
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/skylot/jadx.git /tmp/jadx
          cd /tmp/jadx
          ./gradlew dist --no-daemon
          test -x build/jadx/bin/jadx
          echo "/tmp/jadx/build/jadx/bin" >> "$GITHUB_PATH"
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Verify VDEX input
        shell: bash
        run: |
          set -euo pipefail
          input="rom/system/framework/boot-carservices.vdex"
          test -s "$input"
          file "$input"
          sha256sum "$input"

      - name: Extract, convert CompactDEX and decompile
        shell: bash
        run: |
          set -euo pipefail
          input="rom/system/framework/boot-carservices.vdex"
          output="$GITHUB_WORKSPACE/artifacts/CarServises"
          rm -rf "$output"
          mkdir -p "$output/jadx"

          bash /tmp/vdexExtractor/tools/deodex/run.sh -i "$GITHUB_WORKSPACE/$input" -o "$output" -k 2>&1 | tee "$output/deodex.log"

          deodexed="$output/vdexExtractor_deodexed"
          mapfile -d '' dex_files < <(find "$deodexed" -type f -name '*.dex' -print0 | sort -z)
          if (( ${#dex_files[@]} == 0 )); then
            echo "No standard DEX files were produced by CompactDEX conversion." >&2
            find "$output" -maxdepth 5 -type f -print >&2
            exit 1
          fi

          for dex in "${dex_files[@]}"; do
            name="$(basename "$dex" .dex)"
            target="$output/jadx/$name"
            mkdir -p "$target"
            set +e
            jadx --show-bad-code --threads-count 2 -d "$target" "$dex" 2>&1 | tee "$target/jadx.log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -ne 0 && "$status" -ne 3 ]]; then
              exit "$status"
            fi
            test -d "$target/sources"
            source_count="$(find "$target/sources" -type f -name '*.java' | wc -l)"
            if (( source_count == 0 )); then
              echo "JADX produced no Java source files for $dex." >&2
              exit 1
            fi
            printf 'JADX_EXIT_CODE=%s\nJAVA_SOURCE_COUNT=%s\n' "$status" "$source_count" > "$target/BUILD_INFO.txt"
          done

          sha256sum "$input" > "$output/input.sha256"
          {
            printf 'INPUT=%s\n' "$input"
            printf 'JADX_VERSION=%s\n' "${{ steps.jadx.outputs.version }}"
            printf 'DEX_COUNT=%s\n' "${#dex_files[@]}"
            printf 'JAVA_SOURCE_COUNT=%s\n' "$(find "$output/jadx" -type f -name '*.java' | wc -l)"
          } > "$output/BUILD_INFO.txt"
          find "$output" -type f | sort > "$output/FILE_INDEX.txt"

      - name: Commit decompilation results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/CarServises
          if git diff --cached --quiet; then
            echo "No decompilation output changes."
            exit 0
          fi
          git commit -m "Add CarServices VDEX decompilation"
          git push

      - name: Upload decompilation artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarServises-decompiled
          path: artifacts/CarServises/
          if-no-files-found: error
          retention-days: 30
